name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  workflow-lint:
    name: Workflow syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

  test:
    name: Lint + Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          pip install "pytest==9.1.1" "ruff>=0.4" "hypothesis>=6.0" "pip-audit>=2.7" pywin32 "cryptography>=48.0.1" comtypes "rich>=13.0"
          $portfolio = Get-Content portfolio-lock.json | ConvertFrom-Json
          $sdk = $portfolio.components.selfconnect
          pip install "selfconnect @ git+$($sdk.repository)@$($sdk.commit)"
          pip install -e . --no-deps

      - name: Lint (ruff — complete repository)
        run: python -m ruff check .

      - name: Unit tests and result policy
        run: python -I -c "import runpy; runpy.run_path('tools/ci_test_gate.py', run_name='__main__')"

  ultra-contract-windows:
    name: Ultra live contract (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Checkout pinned BPC and TSK protocol sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $depsRoot = Split-Path $env:GITHUB_WORKSPACE -Parent
          $portfolio = Get-Content "$env:GITHUB_WORKSPACE\portfolio-lock.json" | ConvertFrom-Json
          $bpcCommit = $portfolio.components.'bpc-protocol'.commit
          $tskCommit = $portfolio.components.'tsk-protocol'.commit
          git clone https://github.com/rblake2320/bpc-protocol.git "$depsRoot\bpc-protocol"
          git -C "$depsRoot\bpc-protocol" checkout --detach $bpcCommit
          git clone https://github.com/rblake2320/tsk-protocol.git "$depsRoot\tsk-protocol"
          git -C "$depsRoot\tsk-protocol" checkout --detach $tskCommit
          python -m tools.portfolio_conformance `
            --component-root "bpc-protocol=$depsRoot\bpc-protocol" `
            --component-root "tsk-protocol=$depsRoot\tsk-protocol"

      - name: Build pinned protocol dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $depsRoot = Split-Path $env:GITHUB_WORKSPACE -Parent
          Push-Location "$depsRoot\bpc-protocol"
          npm ci
          npm run build
          npm test
          Pop-Location
          Push-Location "$depsRoot\tsk-protocol"
          npm ci
          npm run build
          npm test
          npm run test:ha
          npm run typecheck
          Pop-Location
          Push-Location ultra_server
          npm ci
          npm test
          Pop-Location

      - name: Install Python contract dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          pip install "pytest>=8" "cryptography>=48.0.1" pywin32
          pip install -e . --no-deps

      - name: Run live Node and Python contracts
        shell: pwsh
        env:
          ULTRA_ADMIN_TOKEN: ci-live-ultra-admin-token-2026
          ULTRA_METRICS_TOKEN: ci-live-ultra-metrics-token-2026
          SC_REQUIRE_ULTRA_SERVER: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $stdout = "$env:RUNNER_TEMP\ultra.stdout.log"
          $stderr = "$env:RUNNER_TEMP\ultra.stderr.log"
          $process = Start-Process node -ArgumentList 'server.js' `
            -WorkingDirectory "$env:GITHUB_WORKSPACE\ultra_server" `
            -WindowStyle Hidden -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($process.HasExited) {
                throw "Ultra Server exited before health verification with code $($process.ExitCode)"
              }
              try {
                Invoke-RestMethod http://127.0.0.1:7777/health | Out-Null
                $healthy = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) {
              throw 'Ultra Server did not become healthy'
            }
            Push-Location ultra_server
            try {
              npm run test:live
            } finally {
              Pop-Location
            }
            python -m pytest tests/test_e2e_ultra_gate.py tests/test_identity_gate.py -q --tb=short
          } finally {
            try {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force -ErrorAction Stop
              }
            } catch {
              Write-Warning "Ultra Server stop cleanup failed: $($_.Exception.Message)"
            }
            try {
              Get-Content $stdout -ErrorAction Stop
            } catch {
              Write-Warning "Ultra Server stdout capture failed: $($_.Exception.Message)"
            }
            try {
              Get-Content $stderr -ErrorAction Stop
            } catch {
              Write-Warning "Ultra Server stderr capture failed: $($_.Exception.Message)"
            }
          }

  ultra-production-restart:
    name: Ultra production durability (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ultra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ultra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres_b:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ultra
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ultra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ULTRA_RUNTIME_MODE: production
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ultra
      REDIS_URL: redis://127.0.0.1:6379/0
      ULTRA_ADMIN_TOKEN: ci-production-ultra-admin-token-2026
      ULTRA_ADMIN_TOKEN_PREVIOUS: ci-previous-ultra-admin-token-2026-retire-me
      ULTRA_METRICS_TOKEN: ci-production-ultra-metrics-token-2026
      ULTRA_METRICS_TOKEN_PREVIOUS: ci-previous-ultra-metrics-token-2026-retire-me
      ULTRA_RECOVERY_HMAC_KEY: ci-production-recovery-hmac-key-2026
      ULTRA_RECOVERY_HMAC_KEY_PREVIOUS: ci-previous-recovery-hmac-key-2026-retire-me
      ULTRA_HA_CLUSTER_ID: ci-shared-state
      ULTRA_HA_GUARD_SECRET: ci-ultra-ha-guard-secret-at-least-32-bytes
      ULTRA_HA_PRIMARY_ID: primary-a
      ULTRA_HA_REPLICA_ID: replica-a
      SC_RECOVERY_WINDOW_SEC: "300"
      SC_REQUIRE_ULTRA_SERVER: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Checkout and build pinned protocol sources
        shell: bash
        run: |
          set -euo pipefail
          deps_root="$(dirname "$GITHUB_WORKSPACE")"
          bpc_commit="$(python -c 'import json; print(json.load(open("portfolio-lock.json"))["components"]["bpc-protocol"]["commit"])')"
          tsk_commit="$(python -c 'import json; print(json.load(open("portfolio-lock.json"))["components"]["tsk-protocol"]["commit"])')"
          git clone https://github.com/rblake2320/bpc-protocol.git "$deps_root/bpc-protocol"
          git -C "$deps_root/bpc-protocol" checkout --detach "$bpc_commit"
          git clone https://github.com/rblake2320/tsk-protocol.git "$deps_root/tsk-protocol"
          git -C "$deps_root/tsk-protocol" checkout --detach "$tsk_commit"
          python -m tools.portfolio_conformance \
            --component-root "bpc-protocol=$deps_root/bpc-protocol" \
            --component-root "tsk-protocol=$deps_root/tsk-protocol"
          npm ci --prefix "$deps_root/bpc-protocol"
          npm run build --prefix "$deps_root/bpc-protocol"
          npm test --prefix "$deps_root/bpc-protocol"
          npm ci --prefix "$deps_root/tsk-protocol"
          npm run build --prefix "$deps_root/tsk-protocol"
          npm test --prefix "$deps_root/tsk-protocol"
          npm run test:ha --prefix "$deps_root/tsk-protocol"
          TSK_REDIS_URL=redis://127.0.0.1:6379/15 \
            npm run test:redis --prefix "$deps_root/tsk-protocol"
          npm run typecheck --prefix "$deps_root/tsk-protocol"
          npm ci --prefix ultra_server
          npm test --prefix ultra_server

      - name: Run independent-state handoff against separate PostgreSQL authorities
        env:
          ULTRA_TEST_POSTGRES_URL_A: postgresql://postgres:postgres@127.0.0.1:5432/ultra
          ULTRA_TEST_POSTGRES_URL_B: postgresql://postgres:postgres@127.0.0.1:5433/ultra
        run: |
          npm run test:independent-state --prefix ultra_server
          npm run test:ultra-outbox --prefix ultra_server

      - name: Install Python contract dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8" "cryptography>=48.0.1"
          pip install -e . --no-deps

      - name: Start production sidecar
        shell: bash
        run: |
          set -euo pipefail
          node ultra_server/server.js >"$RUNNER_TEMP/ultra.stdout.log" 2>"$RUNNER_TEMP/ultra.stderr.log" &
          echo $! >"$RUNNER_TEMP/ultra.pid"
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:7777/health >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Run live production contracts and seed restart proof
        run: |
          npm run test:live --prefix ultra_server
          python -m pytest tests/test_e2e_ultra_gate.py -q --tb=short
          python -m tools.ultra_restart_conformance seed --state "$RUNNER_TEMP/ultra-restart.json"
          node tools/ultra_rotation_conformance.mjs issue --state "$RUNNER_TEMP/ultra-rotation.json"

      - name: Rotate keys, restart, retire old keys, and verify durable identity continuity
        shell: bash
        run: |
          set -euo pipefail
          wait_for_health() {
            for _ in $(seq 1 30); do
              curl --fail --silent http://127.0.0.1:7777/health >/dev/null && return 0
              sleep 1
            done
            return 1
          }

          initial_admin="$ULTRA_ADMIN_TOKEN"
          initial_metrics="$ULTRA_METRICS_TOKEN"
          initial_recovery="$ULTRA_RECOVERY_HMAC_KEY"
          retired_admin="$ULTRA_ADMIN_TOKEN_PREVIOUS"
          retired_metrics="$ULTRA_METRICS_TOKEN_PREVIOUS"
          rotated_admin="ci-rotated-ultra-admin-token-2026"
          rotated_metrics="ci-rotated-ultra-metrics-token-2026"
          rotated_recovery="ci-rotated-recovery-hmac-key-2026"

          kill "$(cat "$RUNNER_TEMP/ultra.pid")"
          wait "$(cat "$RUNNER_TEMP/ultra.pid")" || true
          export ULTRA_ADMIN_TOKEN="$rotated_admin"
          export ULTRA_ADMIN_TOKEN_PREVIOUS="$initial_admin"
          export ULTRA_METRICS_TOKEN="$rotated_metrics"
          export ULTRA_METRICS_TOKEN_PREVIOUS="$initial_metrics"
          export ULTRA_RECOVERY_HMAC_KEY="$rotated_recovery"
          export ULTRA_RECOVERY_HMAC_KEY_PREVIOUS="$initial_recovery"
          node ultra_server/server.js >>"$RUNNER_TEMP/ultra.stdout.log" 2>>"$RUNNER_TEMP/ultra.stderr.log" &
          echo $! >"$RUNNER_TEMP/ultra.pid"
          wait_for_health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $rotated_metrics" http://127.0.0.1:7777/metrics)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $initial_metrics" http://127.0.0.1:7777/metrics)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $retired_metrics" http://127.0.0.1:7777/metrics)" = "401"
          ULTRA_EXPECT_RECOVERY_VALID=1 \
          ULTRA_EXPECT_ADMIN_ACCEPT="$initial_admin" \
          ULTRA_EXPECT_ADMIN_REJECT="$retired_admin" \
            node tools/ultra_rotation_conformance.mjs verify --state "$RUNNER_TEMP/ultra-rotation.json"
          python -m tools.ultra_restart_conformance verify --state "$RUNNER_TEMP/ultra-restart.json"

          kill "$(cat "$RUNNER_TEMP/ultra.pid")"
          wait "$(cat "$RUNNER_TEMP/ultra.pid")" || true
          unset ULTRA_ADMIN_TOKEN_PREVIOUS ULTRA_METRICS_TOKEN_PREVIOUS ULTRA_RECOVERY_HMAC_KEY_PREVIOUS
          node ultra_server/server.js >>"$RUNNER_TEMP/ultra.stdout.log" 2>>"$RUNNER_TEMP/ultra.stderr.log" &
          echo $! >"$RUNNER_TEMP/ultra.pid"
          wait_for_health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $rotated_metrics" http://127.0.0.1:7777/metrics)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $initial_metrics" http://127.0.0.1:7777/metrics)" = "401"
          ULTRA_EXPECT_RECOVERY_VALID=0 \
          ULTRA_EXPECT_ADMIN_ACCEPT="$rotated_admin" \
          ULTRA_EXPECT_ADMIN_REJECT="$initial_admin" \
            node tools/ultra_rotation_conformance.mjs verify \
              --state "$RUNNER_TEMP/ultra-rotation.json" --delete

      - name: Prove shared-state two-node fencing and identity continuity
        shell: bash
        run: |
          set -euo pipefail
          wait_for_health() {
            local port="$1"
            for _ in $(seq 1 30); do
              curl --fail --silent "http://127.0.0.1:${port}/health" >/dev/null && return 0
              sleep 1
            done
            return 1
          }

          kill "$(cat "$RUNNER_TEMP/ultra.pid")"
          wait "$(cat "$RUNNER_TEMP/ultra.pid")" || true
          rm -f "$RUNNER_TEMP/ultra.pid"

          (
            cd ultra_server
            node --input-type=module -e \
              "import pg from 'pg'; const client = new pg.Client({ connectionString: process.env.DATABASE_URL }); await client.connect(); await client.query('CREATE DATABASE ultra_ha'); await client.end();"
          )

          export DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/ultra_ha'
          export REDIS_URL='redis://127.0.0.1:6379/1'
          export ULTRA_HA_ENABLED='true'
          export ULTRA_HA_MAX_COMMAND_AGE_MS='60000'
          export ULTRA_HA_MAX_LEASE_MS='300000'
          export ULTRA_HA_MIN_LEASE_REMAINING_MS='5000'
          export ULTRA_PRIMARY_URL='http://127.0.0.1:7777'
          export ULTRA_REPLICA_URL='http://127.0.0.1:7778'

          ULTRA_SERVER_PORT=7777 \
          ULTRA_HA_NODE_ID="$ULTRA_HA_PRIMARY_ID" \
          ULTRA_HA_NODE_ROLE=primary \
            node ultra_server/server.js >"$RUNNER_TEMP/ultra-primary.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/ultra-primary.pid"
          ULTRA_SERVER_PORT=7778 \
          ULTRA_HA_NODE_ID="$ULTRA_HA_REPLICA_ID" \
          ULTRA_HA_NODE_ROLE=replica \
            node ultra_server/server.js >"$RUNNER_TEMP/ultra-replica.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/ultra-replica.pid"
          wait_for_health 7777
          wait_for_health 7778

          npm run test:ha-live --prefix ultra_server -- preflight
          npm run ha:command --prefix ultra_server -- \
            --url "$ULTRA_PRIMARY_URL" --command activate \
            --cluster-id "$ULTRA_HA_CLUSTER_ID" --node-id "$ULTRA_HA_PRIMARY_ID" \
            --fence-epoch 12 --lease-ms 240000 --by ci-fleet-guard \
            --reason 'hosted shared-state conformance renewal'
          python -m tools.ultra_restart_conformance seed \
            --state "$RUNNER_TEMP/ultra-ha-state.json" --server-url "$ULTRA_PRIMARY_URL"
          npm run test:ha-live --prefix ultra_server -- promote
          python -m tools.ultra_restart_conformance verify \
            --state "$RUNNER_TEMP/ultra-ha-state.json" --server-url "$ULTRA_REPLICA_URL"
          npm run test:ha-live --prefix ultra_server -- \
            assert-old-fenced "$RUNNER_TEMP/ultra-ha-state.json"

          kill "$(cat "$RUNNER_TEMP/ultra-primary.pid")"
          wait "$(cat "$RUNNER_TEMP/ultra-primary.pid")" || true
          ULTRA_SERVER_PORT=7777 \
          ULTRA_HA_NODE_ID="$ULTRA_HA_PRIMARY_ID" \
          ULTRA_HA_NODE_ROLE=primary \
            node ultra_server/server.js >>"$RUNNER_TEMP/ultra-primary.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/ultra-primary.pid"
          wait_for_health 7777
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "$ULTRA_PRIMARY_URL/ready")" = '503'

          redis_container="$(docker ps --filter publish=6379 --format '{{.ID}}' | head -n 1)"
          test -n "$redis_container"
          docker pause "$redis_container" >/dev/null
          ready_code="$(curl --max-time 5 --silent --output /dev/null --write-out '%{http_code}' \
            "$ULTRA_REPLICA_URL/ready" || true)"
          docker unpause "$redis_container" >/dev/null
          test "$ready_code" = '503'
          for _ in $(seq 1 15); do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "$ULTRA_REPLICA_URL/ready")" = '200' && break
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "$ULTRA_REPLICA_URL/ready")" = '200'

          npm run test:ha-live --prefix ultra_server -- corrupt-fence

      - name: Print sidecar logs and stop
        if: always()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/ultra.stdout.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/ultra.stderr.log" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/ultra.pid" || kill "$(cat "$RUNNER_TEMP/ultra.pid")" 2>/dev/null || true
          redis_container="$(docker ps --filter publish=6379 --format '{{.ID}}' | head -n 1 || true)"
          test -z "$redis_container" || docker unpause "$redis_container" >/dev/null 2>&1 || true
          cat "$RUNNER_TEMP/ultra-primary.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/ultra-replica.log" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/ultra-primary.pid" || kill "$(cat "$RUNNER_TEMP/ultra-primary.pid")" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/ultra-replica.pid" || kill "$(cat "$RUNNER_TEMP/ultra-replica.pid")" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ultra-ha-state.json"

  ultra-final-ha-acceptance:
    name: Ultra final HA acceptance (6 PG + Redis quorum/Sentinel)
    runs-on: ubuntu-latest
    services:
      postgres_a:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: bpc_test
          POSTGRES_PASSWORD: bpc-test-only-password
          POSTGRES_DB: bpc_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bpc_test -d bpc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres_b:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: bpc_test
          POSTGRES_PASSWORD: bpc-test-only-password
          POSTGRES_DB: bpc_test
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U bpc_test -d bpc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres_control:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: bpc_test
          POSTGRES_PASSWORD: bpc-test-only-password
          POSTGRES_DB: bpc_test
        ports: [5434:5432]
        options: >-
          --health-cmd "pg_isready -U bpc_test -d bpc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      tsk_postgres_a:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: tsk_test
          POSTGRES_PASSWORD: tsk-test-only-password
          POSTGRES_DB: tsk_test
        ports: [5442:5432]
        options: >-
          --health-cmd "pg_isready -U tsk_test -d tsk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      tsk_postgres_b:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: tsk_test
          POSTGRES_PASSWORD: tsk-test-only-password
          POSTGRES_DB: tsk_test
        ports: [5443:5432]
        options: >-
          --health-cmd "pg_isready -U tsk_test -d tsk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      tsk_postgres_control:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: tsk_test
          POSTGRES_PASSWORD: tsk-test-only-password
          POSTGRES_DB: tsk_test
        ports: [5444:5432]
        options: >-
          --health-cmd "pg_isready -U tsk_test -d tsk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis_a:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports: [6381:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis_b:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports: [6382:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis_c:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports: [6383:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      BPC_TEST_POSTGRES_URL: postgresql://bpc_test:bpc-test-only-password@127.0.0.1:5432/bpc_test
      BPC_TEST_POSTGRES_B_URL: postgresql://bpc_test:bpc-test-only-password@127.0.0.1:5433/bpc_test
      BPC_TEST_POSTGRES_CONTROL_URL: postgresql://bpc_test:bpc-test-only-password@127.0.0.1:5434/bpc_test
      BPC_TEST_REDIS_URLS: redis://127.0.0.1:6381/0,redis://127.0.0.1:6382/0,redis://127.0.0.1:6383/0
      TSK_TEST_POSTGRES_URL_A: postgresql://tsk_test:tsk-test-only-password@127.0.0.1:5442/tsk_test
      TSK_TEST_POSTGRES_URL_B: postgresql://tsk_test:tsk-test-only-password@127.0.0.1:5443/tsk_test
      TSK_TEST_SOURCE_PG_URL_A: postgresql://tsk_test:tsk-test-only-password@127.0.0.1:5442/tsk_test
      TSK_TEST_RECEIVER_PG_URL_B: postgresql://tsk_test:tsk-test-only-password@127.0.0.1:5443/tsk_test
      TSK_TEST_CONTROL_PG_URL: postgresql://tsk_test:tsk-test-only-password@127.0.0.1:5444/tsk_test
      TSK_TEST_REDIS_URL: redis://127.0.0.1:6381/1
      ULTRA_TEST_POSTGRES_URL_A: postgresql://tsk_test:tsk-test-only-password@127.0.0.1:5442/tsk_test
      ULTRA_TEST_POSTGRES_URL_B: postgresql://tsk_test:tsk-test-only-password@127.0.0.1:5443/tsk_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Checkout exact reviewed protocol authorities
        shell: bash
        run: |
          set -euo pipefail
          deps_root="$(dirname "$GITHUB_WORKSPACE")"
          bpc_commit="$(node -e 'const p=require("./portfolio-lock.json"); process.stdout.write(p.components["bpc-protocol"].commit)')"
          tsk_commit="$(node -e 'const p=require("./portfolio-lock.json"); process.stdout.write(p.components["tsk-protocol"].commit)')"
          git clone https://github.com/rblake2320/bpc-protocol.git "$deps_root/bpc-protocol"
          git -C "$deps_root/bpc-protocol" checkout --detach "$bpc_commit"
          git clone https://github.com/rblake2320/tsk-protocol.git "$deps_root/tsk-protocol"
          git -C "$deps_root/tsk-protocol" checkout --detach "$tsk_commit"
          npm ci --prefix "$deps_root/bpc-protocol"
          npm run build --prefix "$deps_root/bpc-protocol"
          npm ci --prefix "$deps_root/tsk-protocol"
          npm run build --prefix "$deps_root/tsk-protocol"
          npm ci --prefix ultra_server
      - name: Configure durable BPC Redis quorum
        shell: bash
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")/bpc-protocol"
          node --input-type=module - <<'NODE'
          import Redis from 'ioredis';
          for (const port of [6381, 6382, 6383]) {
            const client = new Redis(port, '127.0.0.1');
            await client.config('SET', 'appendonly', 'yes');
            await client.config('SET', 'appendfsync', 'always');
            client.disconnect();
          }
          NODE
      - name: Start the exact TSK Sentinel authority used by the handoff
        shell: bash
        run: |
          set -euo pipefail
          sentinel_dir="$(dirname "$GITHUB_WORKSPACE")/tsk-protocol/ci/redis-sentinel"
          docker compose -f "$sentinel_dir/docker-compose.yml" -p tsk-sentinel down -v --remove-orphans || true
          docker compose -f "$sentinel_dir/docker-compose.yml" -p tsk-sentinel up -d
          for _ in $(seq 1 60); do
            replicas="$(docker exec tsk-sentinel-sentinel-1-1 redis-cli -p 26379 sentinel master tskmaster 2>/dev/null | awk '/num-slaves/{getline; print}' | tr -d '\r' || echo 0)"
            [ "${replicas:-0}" -ge 2 ] && break
            sleep 1
          done
          [ "${replicas:-0}" -ge 2 ]
          docker exec tsk-sentinel-redis-master-1 redis-cli WAIT 2 10000 >/dev/null
      - name: Run direct reviewed BPC and TSK protocol composition
        shell: bash
        env:
          BPC_LIVE_COMPOSITION_A_URL: ${{ env.BPC_TEST_POSTGRES_URL }}
          BPC_LIVE_COMPOSITION_B_URL: ${{ env.BPC_TEST_POSTGRES_B_URL }}
          BPC_LIVE_COMPOSITION_CONTROL_URL: ${{ env.BPC_TEST_POSTGRES_CONTROL_URL }}
          BPC_LIVE_COMPOSITION_REDIS_URLS: ${{ env.BPC_TEST_REDIS_URLS }}
          TSK_LIVE_COMPOSITION_A_URL: ${{ env.TSK_TEST_SOURCE_PG_URL_A }}
          TSK_LIVE_COMPOSITION_B_URL: ${{ env.TSK_TEST_RECEIVER_PG_URL_B }}
          TSK_LIVE_COMPOSITION_CONTROL_URL: ${{ env.TSK_TEST_CONTROL_PG_URL }}
          TSK_TEST_SENTINELS: 127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381
          TSK_TEST_SENTINEL_MASTER: tskmaster
          TSK_SENTINEL_NATMAP: 172.28.7.10:6379=127.0.0.1:6390,172.28.7.11:6379=127.0.0.1:6391,172.28.7.12:6379=127.0.0.1:6392
          TSK_SENTINEL_NETWORK: tsk-sentinel_tsknet
          TSK_SENTINEL_MASTER_CONTAINER: tsk-sentinel-redis-master-1
          TSK_SENTINEL_REPLICA1_CONTAINER: tsk-sentinel-redis-replica-1-1
          TSK_SENTINEL_REPLICA2_CONTAINER: tsk-sentinel-redis-replica-2-1
          TSK_SAME_AUTHORITY_FAULTS: "1"
          LIVE_COMPOSITION_COMBINED: "1"
          ULTRA_FINAL_COMMAND_ID: enterprise28-promote-1
          ULTRA_FINAL_EXPECTED_ENTERPRISE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ULTRA_LIVE_COMPOSITION_EVIDENCE_FILE: ${{ runner.temp }}/ultra-live-composition-evidence.json
          ULTRA_LIVE_FAULT_EVIDENCE_FILE: ${{ runner.temp }}/ultra-live-fault-evidence.json
          BPC_PROTOCOL_ROOT: ${{ github.workspace }}/../bpc-protocol
          TSK_PROTOCOL_ROOT: ${{ github.workspace }}/../tsk-protocol
        run: |
          set -euo pipefail
          export ULTRA_TEST_POSTGRES_B_CONTAINER="$(docker ps --filter publish=5443 --format '{{.ID}}')"
          [ -n "$ULTRA_TEST_POSTGRES_B_CONTAINER" ]
          npm run test:protocol-composition --prefix ultra_server
      - name: Run pinned final acceptance and create secret-free evidence
        shell: bash
        env:
          BPC_PROTOCOL_ROOT: ${{ github.workspace }}/../bpc-protocol
          TSK_PROTOCOL_ROOT: ${{ github.workspace }}/../tsk-protocol
          ULTRA_FINAL_EXPECTED_ENTERPRISE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ULTRA_LIVE_COMPOSITION_EVIDENCE_FILE: ${{ runner.temp }}/ultra-live-composition-evidence.json
          ULTRA_LIVE_FAULT_EVIDENCE_FILE: ${{ runner.temp }}/ultra-live-fault-evidence.json
          ULTRA_FINAL_EVIDENCE_FILE: ${{ runner.temp }}/ultra-final-ha-evidence.json
        run: npm run test:final-ha --prefix ultra_server
      - name: Upload immutable non-secret acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ultra-final-ha-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ultra-final-ha-evidence.json
            ${{ runner.temp }}/ultra-live-fault-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Stop TSK Sentinel acceptance authority
        if: always()
        shell: bash
        run: |
          sentinel_dir="$(dirname "$GITHUB_WORKSPACE")/tsk-protocol/ci/redis-sentinel"
          docker compose -f "$sentinel_dir/docker-compose.yml" -p tsk-sentinel down -v --remove-orphans || true
