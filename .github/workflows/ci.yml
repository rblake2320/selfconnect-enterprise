name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Lint + Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pywin32

      - name: Lint (ruff — enterprise + tests + tools)
        run: python -m ruff check enterprise tests tools

      - name: Unit tests
        run: python -m pytest -q --tb=short

      - name: Verify test count
        shell: python
        run: |
          import subprocess, sys, re

          result = subprocess.run(
              ["python", "-m", "pytest", "-q", "--tb=no"],
              capture_output=True, text=True
          )
          output = result.stdout + result.stderr

          # Parse summary line: "716 passed, 0 failed" or "716 passed"
          m = re.search(r'(\d+) passed', output)
          if not m:
              print("FAIL: could not parse test count from pytest output.")
              print("Output was:")
              print(output[-1000:])
              sys.exit(1)

          passed = int(m.group(1))
          failed_m = re.search(r'(\d+) failed', output)
          failed = int(failed_m.group(1)) if failed_m else 0
          skipped_m = re.search(r'(\d+) skipped', output)
          skipped = int(skipped_m.group(1)) if skipped_m else 0

          print(f"Results: {passed} passed, {failed} failed, {skipped} skipped")

          if failed > 0:
              print(f"FAIL: {failed} test(s) failed")
              sys.exit(1)

          if skipped > 0:
              print(f"FAIL: {skipped} test(s) skipped — all supply-chain tests must pass in CI")
              sys.exit(1)

          if passed < 716:
              print(f"FAIL: only {passed} tests passed (expected >= 716)")
              sys.exit(1)

          print(f"OK: {passed} passed, 0 failed, 0 skipped")
