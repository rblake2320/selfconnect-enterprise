[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfconnect-enterprise"
version = "1.2.1"
description = "Enterprise AI agent infrastructure on Win32 — built on SelfConnect SDK"
requires-python = ">=3.10"
dependencies = [
    "selfconnect @ git+https://github.com/rblake2320/selfconnect.git@8cf151dbc5f312ce888e51aa429f62960e1a2ee6",
    "cryptography>=46.0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "hypothesis>=6.0"]

[tool.setuptools.packages.find]
include = ["enterprise*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "RUF"]
ignore = ["RUF022"]
