[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "selfconnect-enterprise"
version = "0.1.0"
description = "Enterprise AI agent infrastructure on Win32 — built on SelfConnect SDK"
requires-python = ">=3.10"
dependencies = [
    "selfconnect @ git+https://github.com/rblake2320/selfconnect.git@v1.0.0-session15",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "RUF"]
ignore = ["RUF022"]
