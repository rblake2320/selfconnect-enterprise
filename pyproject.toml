[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfconnect-enterprise"
version = "1.2.3"
description = "Enterprise AI agent infrastructure on Win32 — built on SelfConnect SDK"
requires-python = ">=3.10"
dependencies = [
    "selfconnect @ git+https://github.com/rblake2320/selfconnect.git@5c493300b937a0f912e32a131061a132d2c11fe8",
    "cryptography>=48.0.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "comtypes>=1.4; sys_platform == 'win32'",
    "hypothesis>=6.0",
    "pip-audit>=2.7",
    "pytest>=8",
    "rich>=13.0",
    "ruff>=0.4",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
scent = "enterprise.cli:main"
scent-provenance-admin = "enterprise.provenance_admin:main"

[tool.setuptools.packages.find]
include = ["enterprise*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "RUF"]
ignore = ["RUF022"]
